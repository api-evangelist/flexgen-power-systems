aid: flexgen-power-systems
name: FlexGen Power Systems
description: 'FlexGen Power Systems is a Durham, North Carolina energy storage technology company founded
  in 2009 that designs, integrates and operates grid-scale battery energy storage systems (BESS) and the
  software that runs them. Its flagship product is HybridOS, a hardware-agnostic energy management system
  (EMS) for multi-source, multi-site battery and solar portfolios, alongside HybridOS Control BMS (a
  US-built battery management system), a solar power plant controller (PPC), EMS retrofit, activation and
  lifecycle services, and data-center power solutions. FlexGen has been named a BloombergNEF Tier 1 energy
  storage company, acquired Clean Energy Services (CES) and the assets of Powin, and states that HybridOS
  exposes automated APIs and historian data API access to customers. No public developer portal, API
  reference or machine-readable specification is published; the HybridOS API surface is reached only
  through customer deployments and the login-gated FlexGen customer portal.'
